[global]
    # --- Protocol & Encryption ---
    # Disables SMB1 and SMB2; forces the most secure version (SMB3)
    server min protocol = SMB3
    server smb encrypt = required
    client ipc min protocol = SMB3
    
    # --- Disable Legacy Discovery ---
    # NetBIOS is noisy and exploitable via poisoning (Responder/NTLM relay)
    disable netbios = yes
    smb ports = 445
    
    # --- Information Disclosure Protection ---
    # Prevents unauthenticated users from listing shares or user accounts
    restrict anonymous = 2
    show add printer wizard = no
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # --- Security & Access ---
    security = user
    passdb backend = tdbsam
    # Hard-block the root user from ever connecting via Samba
    invalid users = root
    
    # --- Network Restriction (CRITICAL) ---
    # Replace 10.0.0. with scoring/team subnet
    # This acts as a secondary firewall.
    hosts allow = 127. 10.0.0.
    hosts deny = ALL

    # --- Logging for Blue Team Monitoring ---
    # Level 3 provides enough info to see login attempts without filling the disk
    log level = 3
    log file = /var/log/samba/log.%m
    max log size = 50

[share]
    path = /srv/samba/share
    comment = Secure Scoring Share
    # Hide the share from network browsing
    browseable = no
    writable = yes
    read only = no
    guest ok = no
    
    # Access Control: Only allow the specific group
    valid users = @smbscoring
    force group = smbscoring
    
    # File creation masks
    create mask = 0660
    directory mask = 0770